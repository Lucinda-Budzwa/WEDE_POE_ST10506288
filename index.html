
<!DOCTYPE html>

        <main>

            <!-- MAIN BANNER -->
            <div class="banner-container">

                <picture>

                    <source

                        srcset="images/banner.jpg"

                    <img
                        src="images/banner.jpg"
                        alt="Bairgs Clothing Boutique fashion collection banner"

                </picture>

            <div class="tagline-container">

                <article class="product-card">

                    <picture>

                            loading="lazy"
                        >

                    </picture>

                </article>


                <!-- SHOES -->
                <article class="product-card">

                    <picture>

                        <img
                            src="images/shoes.jpg"

                            class="product-img"
                            loading="lazy"
                        >

                    </picture>

                    <b>SHOES</b>

                </article>


                <!-- BAGS -->
                <article class="product-card">

                    <picture>

                        <img
                            src="images/bag.jpg"
                            alt="Handbags and accessories collection at Bairgs Boutique"
                            class="product-img"
                            loading="lazy"
                        >
